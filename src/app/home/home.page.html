<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title> Blank </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">BLE</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-grid>
    <ion-row>
      <ion-col>
        <ion-button (click)="startBLESER()">startBLESER</ion-button>
      </ion-col>
    </ion-row>

    <ion-row>
      <ion-col>
        <ion-button (click)="stopBLESER()">stopBLESER</ion-button>
      </ion-col>
    </ion-row>
  </ion-grid>


  <ion-grid>
    <ion-row>
      <ion-col>
        <ion-card-header>
          <ion-card-title>Current List</ion-card-title>
        </ion-card-header>
      
        <ion-card-content>
          {{currentList}}
        </ion-card-content>
      </ion-col>
    </ion-row>

    <ion-row>
      <ion-col>
        <ion-item>
          <ion-input [(ngModel)]="addDeviceID"  label="Add input" placeholder="78:02:B7:08:14:51"></ion-input>
        </ion-item>
        <ion-button (click)="setNewDevice()">setNewDevice</ion-button>
      </ion-col>
    </ion-row>

    <ion-row>
      <ion-col>
        <ion-item>
          <ion-input [(ngModel)]="rmDeviceID"  label="Rm input" placeholder="78:02:B7:08:14:51"></ion-input>
        </ion-item>
        <ion-button (click)="rmDevice()">rmDevice</ion-button>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
